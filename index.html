<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض بيانات المستخدمين</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            direction: rtl;
            text-align: center;
            background-color: #f9f9f9;
        }
        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 90%;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
        }
        th {
            background-color: #f4f4f4;
        }
        a {
            color: #3498db;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>بيانات المستخدمين</h1>
    <table>
        <thead>
            <tr>
                <th>معرف المستخدم</th>
                <th>الاسم</th>
                <th>المستوى</th>
                <th>النقاط</th>
                <th>رابط الملف</th>
            </tr>
        </thead>
        <tbody id="userTable">
            <!-- سيتم ملء البيانات بواسطة JavaScript -->
        </tbody>
    </table>

    <script>
        // رابط المستودع الخاص ببيانات المستخدمين
        const repoUrl = 'https://ahmed1p7.github.io/user-info-site/users/';

        // مثال بيانات المستخدمين (سيتم استبدالها بالبيانات الفعلية من المستودع)
        const users = {
            "user1": { name: "أحمد", level: 5, exp: 120 },
            "user2": { name: "منى", level: 3, exp: 80 },
            "user3": { name: "سعيد", level: 8, exp: 200 }
        };

        // ملء الجدول بالبيانات
        const userTable = document.getElementById('userTable');

        Object.entries(users).forEach(([userId, userData]) => {
            const row = document.createElement('tr');

            row.innerHTML = `
                <td>${userId}</td>
                <td>${userData.name}</td>
                <td>${userData.level}</td>
                <td>${userData.exp}</td>
                <td><a href="${repoUrl}${userId}.json" target="_blank">عرض الملف</a></td>
            `;

            userTable.appendChild(row);
        });
    </script>
</body>
</html>
