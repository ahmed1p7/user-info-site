<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة المستخدمين</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 50px;
        }
        .user-list {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: inline-block;
        }
        h1 {
            color: #333;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            margin: 10px 0;
        }
        a {
            text-decoration: none;
            color: #007bff;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="user-list">
        <h1>قائمة المستخدمين</h1>
        <ul id="user-list">
            <!-- سيتم ملء هذه القائمة بالملفات تلقائيًا -->
        </ul>
    </div>

    <script>
        // جلب قائمة ملفات المستخدمين
        fetch('https://api.github.com/repos/ahmed1p7/user-profiles/contents/profiles')
            .then(response => response.json())
            .then(data => {
                const userList = document.getElementById('user-list');
                data.forEach(file => {
                    if (file.name.endsWith('.html')) {
                        const li = document.createElement('li');
                        const a = document.createElement('a');
                        a.href = `https://ahmed1p7.github.io/user-profiles/profiles/${file.name}`;
                        a.innerText = file.name.replace('.html', '');
                        li.appendChild(a);
                        userList.appendChild(li);
                    }
                });
            })
            .catch(error => {
                console.error('Error fetching user list:', error);
            });
    </script>
</body>
</html>
