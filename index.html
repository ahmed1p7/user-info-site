<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معلومات المستخدم</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 50px;
        }
        .user-info {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: inline-block;
        }
        h1 {
            color: #333;
        }
        p {
            font-size: 18px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="user-info">
        <h1>معلومات المستخدم</h1>
        <p id="name">الاسم: جاري التحميل...</p>
        <p id="level">المستوى: جاري التحميل...</p>
        <p id="exp">النقاط: جاري التحميل...</p>
    </div>

    <script>
        // الحصول على معرف المستخدم من الرابط
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('id');

        // جلب بيانات المستخدم من API
        fetch(`https://your-api-endpoint.com/api/user?id=${userId}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById('name').innerText = `الاسم: ${data.name}`;
                document.getElementById('level').innerText = `المستوى: ${data.level}`;
                document.getElementById('exp').innerText = `النقاط: ${data.exp}`;
            })
            .catch(error => {
                console.error('Error fetching user data:', error);
                document.getElementById('name').innerText = 'الاسم: غير معروف';
                document.getElementById('level').innerText = 'المستوى: غير معروف';
                document.getElementById('exp').innerText = 'النقاط: غير معروف';
            });
    </script>
</body>
</html>
