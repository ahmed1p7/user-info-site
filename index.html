<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FATIMA BOT - عارض ملفات اللاعبين - فاطمة بوت">
  <meta name="theme-color" content="#0a0a1a">
  <title>FATIMA BOT - ملفات اللاعبين</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>~</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header page-enter">
    <div class="bot-icon">~</div>
    <h1 class="site-title">FATIMA BOT</h1>
    <p class="site-subtitle">عارض ملفات اللاعبين</p>
  </header>

  <!-- Main Content -->
  <main class="container-wide page-enter">

    <!-- Player Count -->
    <div class="text-center">
      <div class="player-count" id="playerCount">
        جاري التحميل...
      </div>
    </div>

    <!-- Search -->
    <div class="search-wrapper">
      <input
        type="text"
        class="search-input"
        id="searchInput"
        placeholder="ابحث عن لاعب..."
        autocomplete="off"
      >
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </div>

    <!-- Players Grid -->
    <div class="players-grid" id="playersGrid">
      <div class="glass-card skeleton-card skeleton"></div>
      <div class="glass-card skeleton-card skeleton"></div>
      <div class="glass-card skeleton-card skeleton"></div>
      <div class="glass-card skeleton-card skeleton"></div>
      <div class="glass-card skeleton-card skeleton"></div>
      <div class="glass-card skeleton-card skeleton"></div>
    </div>

    <!-- No Results -->
    <div class="no-results" id="noResults" style="display:none;">
      <div style="font-size:40px; margin-bottom:12px; opacity:0.4;">?</div>
      <div>لم يتم العثور على نتائج</div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <p class="footer-text">
      <span class="footer-bot">FATIMA BOT</span> -- صفحة معلومات اللاعبين
    </p>
  </footer>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      FatimaApp.initIndexPage();
    });
  </script>
</body>
</html>
